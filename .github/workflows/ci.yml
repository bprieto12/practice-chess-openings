name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's official image has the browsers and their system libraries
    # preinstalled, so runs don't download ~340 MB of apt packages each time.
    # The tag must match @playwright/test in package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - name: Check the image matches the installed Playwright
        env:
          IMAGE_VERSION: "1.49.0"
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$IMAGE_VERSION" ]; then
            echo "::error::Playwright image is $IMAGE_VERSION but package-lock.json has $installed. Update the image tag in ci.yml."
            exit 1
          fi

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    # Pull requests (including from forks) only run tests; only main deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3 and CloudFront
        run: scripts/deploy.sh dist
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
